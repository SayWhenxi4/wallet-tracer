<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161c24;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Central consolidator node (large red) -->
  <circle cx="256" cy="256" r="45" fill="#ff6b6f" filter="url(#glow)"/>
  
  <!-- Secondary consolidators (medium nodes) -->
  <circle cx="160" cy="180" r="32" fill="#ffb454" filter="url(#glow)"/>
  <circle cx="352" cy="180" r="32" fill="#ffb454" filter="url(#glow)"/>
  <circle cx="140" cy="320" r="32" fill="#ffb454" filter="url(#glow)"/>
  <circle cx="372" cy="320" r="32" fill="#ffb454" filter="url(#glow)"/>
  
  <!-- Relay nodes (small teal) -->
  <circle cx="110" cy="120" r="22" fill="#6ec9e0" filter="url(#glow)"/>
  <circle cx="402" cy="120" r="22" fill="#6ec9e0" filter="url(#glow)"/>
  <circle cx="80" cy="280" r="22" fill="#6ec9e0" filter="url(#glow)"/>
  <circle cx="432" cy="280" r="22" fill="#6ec9e0" filter="url(#glow)"/>
  <circle cx="100" cy="400" r="22" fill="#6ec9e0" filter="url(#glow)"/>
  <circle cx="412" cy="400" r="22" fill="#6ec9e0" filter="url(#glow)"/>
  
  <!-- Exchange node (green) -->
  <circle cx="256" cy="100" r="28" fill="#4ade95" filter="url(#glow)"/>
  
  <!-- Connection lines (flowing inward to center) -->
  <line x1="110" y1="120" x2="160" y2="180" stroke="#6ec9e0" stroke-width="2" opacity="0.6"/>
  <line x1="160" y1="180" x2="220" y2="230" stroke="#6ec9e0" stroke-width="2" opacity="0.6"/>
  <line x1="402" y1="120" x2="352" y2="180" stroke="#6ec9e0" stroke-width="2" opacity="0.6"/>
  <line x1="352" y1="180" x2="292" y2="230" stroke="#6ec9e0" stroke-width="2" opacity="0.6"/>
  
  <line x1="80" y1="280" x2="140" y2="320" stroke="#6ec9e0" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="320" x2="210" y2="290" stroke="#6ec9e0" stroke-width="2" opacity="0.6"/>
  <line x1="432" y1="280" x2="372" y2="320" stroke="#6ec9e0" stroke-width="2" opacity="0.6"/>
  <line x1="372" y1="320" x2="302" y2="290" stroke="#6ec9e0" stroke-width="2" opacity="0.6"/>
  
  <line x1="100" y1="400" x2="160" y2="360" stroke="#ffb454" stroke-width="2" opacity="0.6"/>
  <line x1="160" y1="360" x2="210" y2="300" stroke="#ffb454" stroke-width="2" opacity="0.6"/>
  <line x1="412" y1="400" x2="352" y2="360" stroke="#ffb454" stroke-width="2" opacity="0.6"/>
  <line x1="352" y1="360" x2="302" y2="300" stroke="#ffb454" stroke-width="2" opacity="0.6"/>
  
  <!-- Center connections to main node -->
  <line x1="220" y1="230" x2="256" y2="256" stroke="#ff6b6f" stroke-width="2.5" opacity="0.8"/>
  <line x1="292" y1="230" x2="256" y2="256" stroke="#ff6b6f" stroke-width="2.5" opacity="0.8"/>
  <line x1="210" y1="290" x2="256" y2="256" stroke="#ff6b6f" stroke-width="2.5" opacity="0.8"/>
  <line x1="302" y1="290" x2="256" y2="256" stroke="#ff6b6f" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Top exchange connection -->
  <line x1="256" y1="100" x2="256" y2="211" stroke="#4ade95" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Subtle directional arrows on key flows -->
  <polygon points="256,220 252,230 260,230" fill="#ff6b6f" opacity="0.7"/>
  
  <!-- Magnifying glass outline for forensics hint - bolder and red -->
  <circle cx="100" cy="450" r="35" fill="none" stroke="#ff6b6f" stroke-width="5" opacity="0.9"/>
  <line x1="130" y1="480" x2="155" y2="505" stroke="#ff6b6f" stroke-width="5" opacity="0.9"/>
</svg>